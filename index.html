 return head('Attendance register','P present, L late, A absent',`<button class="btn" onclick="markAll()">Mark all present</button>`)+
 `<div class="flex flex-wrap gap-2 mb-4">${sel('Class',CL,S.ac,'setAc')}<input type="date" class="inp !w-auto" value="${S.ad}" onchange="S.ad=this.value;render()" aria-label="Date"></div>
 <div class="flex flex-wrap gap-2 mb-4">${chip(c.P,'Present','b-ok')}${chip(c.L,'Late','b-warn')}${chip(c.A,'Absent','b-bad')}${chip(l.length-c.P-c.L-c.A,'Unmarked','b-mute')}</div>
 <div class="card divide-y divide-line">${l.map(s=>`<div class="flex items-center gap-3 px-4 py-2.5">${av(s.name)}<span class="flex-1 text-sm font-medium">${s.name}</span><span class="flex border border-line rounded-lg overflow-hidden">${b(s,'P','bg-ok')}${b(s,'L','bg-warn')}${b(s,'A','bg-bad')}</span></div>`).join('')}</div>`},

Grades(){
 const k=S.gc+'|'+S.gs,sc=db.scores[k]||{},l=inCls(S.gc),rk=ranked(S.gc),ts=l.map(s=>total(S.gc,S.gs,s.id)),m=ts.length?ts.reduce((a,b)=>a+b,0)/ts.length:0,pr=ts.length?Math.round(ts.filter(x=>x>=40).length/ts.length*100):0;
 return head('Grades','Continuous assessment out of 40, exam out of 60')+
 `<div class="flex flex-wrap gap-2 mb-4">${sel('Class',CL,S.gc,'setGc')}${sel('Subject',SB,S.gs,'setGs')}<span class="badge b-mute !text-sm !px-3 self-center">Class mean ${m.toFixed(1)}</span><span class="badge b-ok !text-sm !px-3 self-center">Pass rate ${pr}%</span></div>`+
 table(['Student','CA /40','Exam /60','Total','Grade','Remark'],l.map(s=>{const v=sc[s.id]||[0,0],t=v[0]+v[1],g=grade(t);return`<tr><td class="td"><div class="flex items-center gap-3">${av(s.name)}<span class="font-medium">${s.name}</span></div></td><td class="td"><input type="number" min="0" max="40" value="${v[0]}" class="inp !w-20" onchange="setScore(${s.id},0,this.value,40)" aria-label="CA score"></td><td class="td"><input type="number" min="0" max="60" value="${v[1]}" class="inp !w-20" onchange="setScore(${s.id},1,this.value,60)" aria-label="Exam score"></td><td class="td font-semibold">${t}</td><td class="td"><span class="badge ${t>=50?'b-ok':t>=40?'b-warn':'b-bad'}">${g[0]}</span></td><td class="td text-mute">${g[1]}</td></tr>`}).join(''),'min-w-[640px]')+
 `<h2 class="font-display font-bold mt-8 mb-3">Class positions, ${S.gc} <span class="text-sm font-normal text-mute">(tap a name for the report card)</span></h2><div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-3">${rk.map((s,i)=>`<button onclick="card(${s.id})" class="card p-3 text-left hover:border-gold flex items-center gap-3"><span class="font-display text-xl font-bold w-8 text-mute">${i+1}</span><span class="min-w-0"><span class="block text-sm font-semibold truncate">${s.name}</span><span class="block text-xs text-mute">Average ${s.avg.toFixed(1)}%</span></span></button>`).join('')}</div>`},

Fees(){
 const l=db.students.filter(s=>S.fq=='All'||s.cls==S.fq),e=l.reduce((a,s)=>a+fee(s.cls),0),g=l.reduce((a,s)=>a+s.paid,0);
 return head('School fees','Per term: '+N(85000)+' for JSS, '+N(110000)+' for SS')+
 `<div class="grid grid-cols-3 gap-4 mb-4">${[['Expected',N(e),''],['Collected',N(g),'text-ok'],['Outstanding',N(e-g),'text-bad']].map(x=>`<div class="card p-4"><div class="text-xs text-mute">${x[0]}</div><div class="font-display text-lg md:text-2xl font-bold ${x[2]}">${x[1]}</div></div>`).join('')}</div>
 <div class="mb-4">${sel('Class',['All',...CL],S.fq,'setFq')}</div>`+
 table(['Student','Class','Paid','Balance','Status','Progress',''],l.map(s=>{const f=fee(s.cls),o=f-s.paid,pc=Math.round(s.paid/f*100),st=feeStat(s);return`<tr><td class="td"><div class="flex items-center gap-3">${av(s.name)}<span class="font-medium">${s.name}</span></div></td><td class="td">${s.cls}</td><td class="td">${N(s.paid)}</td><td class="td">${o>0?N(o):'–'}</td><td class="td"><span class="badge ${st[1]}">${st[0]}</span></td><td class="td w-28"><div class="h-1.5 rounded-full bg-line"><div class="h-1.5 rounded-full bg-gold" style="width:${pc}%"></div></div></td><td class="td text-right">${o>0?`<button class="btn2 !py-1 !px-3 !text-xs" onclick="pay(${s.id})">Record payment</button>`:''}</td></tr>`}).join(''),'min-w-[760px]')}
};

function rowsS(){
 const q=S.sq.toLowerCase(),l=db.students.filter(s=>(S.sc=='All'||s.cls==S.sc)&&s.name.toLowerCase().includes(q));
 $('#cnt').textContent=l.length+(l.length==1?' student':' students');
 $('#tbl').innerHTML=table(['Student','Class','Sex','Average','Fees',''],l.map(s=>{const st=feeStat(s);return`<tr><td class="td"><div class="flex items-center gap-3">${av(s.name)}<span class="font-medium">${s.name}</span></div></td><td class="td">${s.cls}</td><td class="td">${s.g}</td><td class="td">${avg(s).toFixed(1)}%</td><td class="td"><span class="badge ${st[1]}">${st[0]}</span></td><td class="td text-right whitespace-nowrap"><button class="text-xs font-medium underline mr-3" onclick="card(${s.id})">Report card</button><button class="text-xs text-bad hover:underline" onclick="delStudent(${s.id})">Remove</button></td></tr>`}).join(''))}
function render(){
 $('#side').innerHTML=TABS.map(t=>`<button onclick="tab='${t[0]}';render()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-left ${t[0]==tab?'bg-white/10 text-white font-semibold border-l-4 border-gold':'text-white/70 hover:bg-white/10 border-l-4 border-transparent'}">${ic(t[1],'w-5 h-5')}${t[0]}</button>`).join('');
 $('#bot').innerHTML=TABS.map(t=>`<button onclick="tab='${t[0]}';render()" class="flex flex-col items-center gap-1 py-2 text-[10px] ${t[0]==tab?'text-ink font-semibold':'text-mute'}"><span class="${t[0]==tab?'bg-gold/25':''} rounded-full px-3 py-1">${ic(t[1],'w-5 h-5')}</span>${t[0]}</button>`).join('');
 $('#crumb').textContent=tab;$('#app').innerHTML=V[tab]();if(tab=='Students')rowsS();scrollTo(0,0)}
const setSc=v=>{S.sc=v;render()},setAc=v=>{S.ac=v;render()},setGc=v=>{S.gc=v;render()},setGs=v=>{S.gs=v;render()},setFq=v=>{S.fq=v;render()};
function mark(id,m){const k=S.ad+'|'+S.ac;(db.att[k]=db.att[k]||{})[id]=m;save();const y=scrollY;render();scrollTo(0,y)}
function markAll(){const k=S.ad+'|'+S.ac;db.att[k]={};inCls(S.ac).forEach(s=>db.att[k][s.id]='P');save();render();toast('All of '+S.ac+' marked present')}
function setScore(id,i,v,max){const k=S.gc+'|'+S.gs;db.scores[k]=db.scores[k]||{};const a=db.scores[k][id]||[0,0];a[i]=Math.max(0,Math.min(max,+v||0));db.scores[k][id]=a;save();const y=scrollY;render();scrollTo(0,y)}
function modal(h){$('#mc').innerHTML=h;$('#m').classList.remove('hidden');$('#m').classList.add('flex')}
function closeM(){$('#m').classList.add('hidden');$('#m').classList.remove('flex')}
function form(title,fs,cb,msg){modal(`<h3 class="font-display text-xl font-bold mb-4">${title}</h3><form id="f" class="space-y-3">${fs.map(f=>`<label class="block text-sm font-medium">${f.l}${f.o?`<select name="${f.k}" class="inp mt-1">${opts(f.o)}</select>`:`<input name="${f.k}" type="${f.t||'text'}" ${f.x||''} required class="inp mt-1">`}</label>`).join('')}<div class="flex gap-2 justify-end pt-2"><button type="button" onclick="closeM()" class="btn2">Cancel</button><button class="btn">Save</button></div></form>`);
 $('#f').onsubmit=e=>{e.preventDefault();cb(Object.fromEntries(new FormData(e.target)));closeM();save();render();toast(msg||'Saved')}}
const nid=a=>a.reduce((m,x)=>Math.max(m,x.id),0)+1;
function addStudent(){form('Add student',[{k:'name',l:'Full name'},{k:'cls',l:'Class',o:CL},{k:'g',l:'Sex',o:['M','F']}],d=>db.students.push({id:nid(db.students),name:d.name,cls:d.cls,g:d.g,paid:0}),'Student added')}
function delStudent(id){if(confirm('Remove this student and their records?')){db.students=db.students.filter(s=>s.id!=id);save();rowsS();toast('Student removed')}}
function addTeacher(){form('Add teacher',[{k:'name',l:'Full name'},{k:'subj',l:'Subject',o:SB},{k:'cls',l:'Form class',o:CL}],d=>db.teachers.push({id:nid(db.teachers),...d}),'Teacher added')}
function delTeacher(id){db.teachers=db.teachers.filter(t=>t.id!=id);save();render();toast('Teacher removed')}
function pay(id){const s=db.students.find(x=>x.id==id),o=fee(s.cls)-s.paid;form('Record payment',[{k:'amt',l:`${s.name}: balance ${N(o)}. Amount received (₦)`,t:'number',x:`min="1" max="${o}"`}],d=>{s.paid=Math.min(fee(s.cls),s.paid+ +d.amt)},'Payment recorded')}
function exportCsv(){const r=[['Name','Class','Sex','Fee paid','Fee balance'],...db.students.map(s=>[s.name,s.cls,s.g,s.paid,fee(s.cls)-s.paid])];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([r.map(x=>x.join(',')).join('\n')],{type:'text/csv'}));a.download='students.csv';a.click();toast('Students exported')}
function card(id){const s=db.students.find(x=>x.id==id),pos=ranked(s.cls).findIndex(x=>x.id==id)+1,a=avg(s);
 modal(`<div class="text-center border-b border-line pb-4 mb-4"><div class="font-display text-xl font-bold">Mainland Heritage College</div><div class="text-xs text-mute">Terminal report · Term 1, 2026/2027 session</div></div>
 <div class="flex items-center gap-3 mb-4">${av(s.name)}<div><div class="font-display text-lg font-bold">${s.name}</div><div class="text-sm text-mute">${s.cls} · Position ${pos} of ${inCls(s.cls).length} · Average ${a.toFixed(1)}%</div></div></div>
 <table class="w-full text-sm"><tr><th class="th">Subject</th><th class="th">CA</th><th class="th">Exam</th><th class="th">Total</th><th class="th">Grade</th></tr>${SB.map(b=>{const v=(db.scores[s.cls+'|'+b]||{})[id]||[0,0],t=v[0]+v[1],g=grade(t);return`<tr><td class="td">${b}</td><td class="td">${v[0]}</td><td class="td">${v[1]}</td><td class="td font-semibold">${t}</td><td class="td"><span class="badge ${t>=50?'b-ok':t>=40?'b-warn':'b-bad'}">${g[0]}</span> <span class="text-mute text-xs">${g[1]}</span></td></tr>`}).join('')}</table>
 <p class="text-sm mt-4"><b>Form teacher's remark:</b> ${a>=70?'An outstanding term. Keep it up.':a>=50?'A steady term with room to grow.':'Needs extra support. Please meet the form teacher.'}</p>
 <div class="grid grid-cols-2 gap-6 mt-8 text-xs text-mute"><div class="border-t border-line pt-1">Form teacher</div><div class="border-t border-line pt-1">Principal</div></div>
 <div class="flex gap-2 justify-end mt-5 noprint"><button class="btn2" onclick="closeM()">Close</button><button class="btn" onclick="print()">${ic('print','w-4 h-4')}Print</button></div>`)}
$('#crest').innerHTML=ic('cap','w-6 h-6');$('#crest2').innerHTML=ic('cap','w-4 h-4');
render();
</script>
</body>
</html>
